<!-- ═══════════════════════════════════════════════════════════════════════════
  PA BOOTCAMP — LIVE CLASSROOM POLLING  (ix-live v1)

  Paste this ONE block immediately before the closing body tag in any syllabus
  already uses the .ix-poll engine. It needs no other edits.

  ── HOW IT ACTIVATES ──────────────────────────────────────────────────────
  Dormant by default. With no ?session= in the URL the file behaves exactly as
  it does today (private self-check, reveal on submit). Nothing changes for
  students studying at home.

    Students   →  …/pa-bootcamp-ecg-v3-standalone.html?session=aug12am
    Presenter  →  …/pa-bootcamp-ecg-v3-standalone.html?session=aug12am&present=1&annotate=1

  THE SESSION VALUE MUST MATCH ON EVERY DEVICE. Different session = different
  bucket = you will see nothing.

  ── WHAT IT DOES ──────────────────────────────────────────────────────────
  • Real cross-device tallies (Firebase, push-based — no polling load)
  • Students who submit see "Answer locked in", NOT the green correct option
  • The correct answer, the feedback line, the explanation panel and the class
    bars all stay hidden until YOU release the question
  • Presenter panel: live "27 / 40 answered", per-question reveal, countdown
  • One vote per device per question, survives a page refresh

  ── SETUP (5 minutes, once) ───────────────────────────────────────────────
  1. console.firebase.google.com → Add project (analytics not needed)
  2. Build → Realtime Database → Create database → Start in TEST mode
  3. Project settings → Your apps → Web (</>) → register → copy the config
  4. Paste apiKey / authDomain / databaseURL / projectId into CFG.firebase below
  5. Realtime Database → Rules → paste this, then Publish:

       {
         "rules": {
           "s": {
             "$session": {
               ".read": true,
               ".write": true,
               ".validate": "$session.length < 40"
             }
           }
         }
       }

     Open read/write is acceptable for an anonymous classroom tally with no
     personal data in it. Rotate the session value each cohort. Do not put
     anything sensitive in this database.

  ── REHEARSE WITHOUT FIREBASE ─────────────────────────────────────────────
  Set mode:'rehearsal' and open the file in several tabs on one machine, one of
  them with &present=1. Each tab acts as a separate student, so you can practice
  the whole flow — locking, counting, revealing, the timer — before class.
═══════════════════════════════════════════════════════════════════════════ -->
<script>
window.IX_LIVE = {
  mode: 'firebase',      /* 'firebase' = real class · 'rehearsal' = multi-tab on one machine */
  classSize: 40,         /* the denominator in "27 / 40 answered"; editable live in the panel */
  gate: 'manual',        /* 'manual' = you press Reveal · 'threshold' = auto at responseTarget */
  responseTarget: 0.9,   /* used only when gate:'threshold' */
  timerSeconds: 90,      /* countdown length; 0 disables the timer button */
  closeOnTimeUp: true,   /* when the clock hits zero, stop accepting answers */
  openAfterRelease: true,/* once released, the explanation is readable even by someone
                            who never answered — a late joiner or a mid-question reload */
  revealOnTimeUp: false, /* and also reveal automatically */
  firebase: {
    apiKey:      'PASTE_API_KEY',
    authDomain:  'PASTE_PROJECT.firebaseapp.com',
    databaseURL: 'https://PASTE_PROJECT-default-rtdb.firebaseio.com',
    projectId:   'PASTE_PROJECT'
  }
};

(function () {
  'use strict';
  var CFG = window.IX_LIVE;
  var Q   = new URLSearchParams(location.search);
  var SESSION = Q.get('session');
  var PRESENT = Q.get('present') === '1';
  /* ?mode=rehearsal practices the whole flow in several tabs, no Firebase needed */
  if (Q.get('mode') === 'rehearsal' || Q.get('mode') === 'firebase') CFG.mode = Q.get('mode');

  /* Dormant unless a session is named — self-study behavior is untouched. */
  if (!SESSION) return;

  /* Take over from the built-in local tally so bars are not drawn twice. */
  if (window.IX_RESULTS) { window.IX_RESULTS.enabled = false; window.IX_RESULTS.showBeforeAnswer = false; }

  var LET = 'ABCDE';
  var polls = [], byId = {}, ctrl = {}, counts = {}, myPick = {};
  var connected = 0, panel = null, curId = null;

  /* ── identity: per device for real classes, per tab when rehearsing ────── */
  function deviceId() {
    var k = 'ixl-dev', bag = (CFG.mode === 'rehearsal') ? sessionStorage : localStorage;
    var v;
    try { v = bag.getItem(k); } catch (e) {}
    if (!v) {
      v = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      try { bag.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  var DEV = deviceId();

  /* ── styles ───────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent = [
    /* HOLD: suppress every correctness signal until the question is released.
       CSS-based on purpose — it cannot lose a race with the grader. */
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-opt.ix-ok,',
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-opt.ix-no{',
      'border-color:var(--border)!important;background:#fff!important;}',
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-opt.ix-ok .ix-let,',
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-opt.ix-no .ix-let{color:var(--mid)!important;}',
    'body.ixl-live .ix-poll:not(.ixl-open) details.ix-rev{display:none!important;}',
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-fb{font-size:0!important;}',
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-fb::after{',
      'content:"\\2713  Answer locked in \\2014 waiting for the class";',
      'font-size:12px;color:var(--navy);font-weight:700;}',
    /* the student's own choice, shown neutrally so they know it registered */
    'body.ixl-live .ix-poll:not(.ixl-open) .ix-opt.ixl-mine{',
      'border-color:var(--navy-bd)!important;background:var(--navy-lt)!important;}',
    /* answers closed */
    '.ixl-closed .ix-sub-btn{opacity:.45!important;cursor:default!important;}',
    /* per-question status strip */
    '.ixl-strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;',
      "font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mid);}",
    '.ixl-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:ixlp 1.6s ease-in-out infinite;}',
    '@keyframes ixlp{0%,100%{opacity:1}50%{opacity:.25}}',
    '.ixl-clock{font-weight:600;color:var(--navy);}',
    '.ixl-mini{margin-left:auto;background:var(--navy);color:#fff;border:none;border-radius:6px;',
      "padding:4px 9px;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;",
      'text-transform:uppercase;cursor:pointer;}',
    '.ixl-mini+.ixl-mini{margin-left:5px;}',
    '.ixl-mini.ixl-on{background:var(--red);}',
    '.ixl-clock.ixl-warn{color:var(--red);}',
    /* class result bars (students see them only after release) */
    '.ixl-bars{margin-top:12px;padding-top:11px;border-top:1px solid var(--border);}',
    '.ixl-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;}',
    ".ixl-let{font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;color:var(--mid);width:11px;flex:none;}",
    '.ixl-track{flex:1;height:15px;background:var(--light);border:1px solid var(--border);border-radius:8px;overflow:hidden;}',
    '.ixl-fill{height:100%;width:0;background:var(--mid);border-radius:7px;transition:width .45s cubic-bezier(.4,0,.2,1);}',
    ".ixl-pct{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--slate);width:52px;text-align:right;flex:none;}",
    '.ixl-row.ixl-key .ixl-let{color:var(--green);} .ixl-row.ixl-key .ixl-fill{background:var(--green);}',
    '.ixl-row.ixl-mine .ixl-let::after{content:"\\2190";margin-left:3px;color:var(--red);}',
    /* presenter panel — bottom LEFT, so it never collides with the ink pill */
    '#ixl-panel{position:fixed;left:12px;bottom:12px;z-index:99996;width:300px;',
      'background:rgba(15,31,61,.97);color:#fff;border-radius:12px;padding:12px 13px;',
      "font-family:'DM Sans',system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);}",
    '#ixl-panel.ixl-min{width:auto;padding:8px 11px;}',
    '#ixl-panel.ixl-min .ixl-hide{display:none;}',
    "#ixl-panel .ixl-hd{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.16em;",
      'text-transform:uppercase;opacity:.55;display:flex;align-items:center;gap:7px;}',
    '#ixl-panel .ixl-hd button{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;',
      'border:none;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1;}',
    '#ixl-panel .ixl-qn{font-weight:700;font-size:12.5px;margin:7px 0 2px;line-height:1.35;}',
    '#ixl-panel .ixl-big{font-size:26px;font-weight:800;line-height:1;margin:8px 0 2px;}',
    '#ixl-panel .ixl-sub{font-size:10.5px;opacity:.6;}',
    '#ixl-panel .ixl-meter{height:6px;background:rgba(255,255,255,.16);border-radius:4px;margin:9px 0 10px;overflow:hidden;}',
    '#ixl-panel .ixl-meter i{display:block;height:100%;width:0;background:#4ade80;transition:width .3s;}',
    '#ixl-panel .ixl-btns{display:flex;gap:6px;flex-wrap:wrap;}',
    '#ixl-panel button.ixl-a{flex:1;min-width:70px;background:#C8392B;color:#fff;border:none;border-radius:8px;',
      "padding:9px 8px;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;}",
    '#ixl-panel button.ixl-b{background:rgba(255,255,255,.15);}',
    '#ixl-panel button.ixl-a:disabled{opacity:.4;cursor:default;}',
    '#ixl-panel .ixl-foot{margin-top:9px;font-size:10px;opacity:.55;line-height:1.5;}',
    '#ixl-panel input.ixl-n{width:44px;background:rgba(255,255,255,.14);border:none;color:#fff;',
      "border-radius:5px;padding:2px 5px;font-family:'DM Mono',monospace;font-size:10px;}",
    '@media print{#ixl-panel{display:none!important;}}',
    /* released questions become readable without having answered, when enabled */
    (CFG.openAfterRelease
      ? 'body.ixl-live .ix-poll.ixl-open details.ix-rev{display:block!important;}' : '')
  ].join('');
  document.head.appendChild(css);
  document.body.classList.add('ixl-live');

  /* ══ TRANSPORTS ═══════════════════════════════════════════════════════════
     Both expose the same five methods, so the UI below never knows which is
     in use. vote() is keyed by device id, which is what makes a refresh
     harmless instead of a double vote.                                      */

  function RehearsalT() {
    var CH = null;
    try { CH = new BroadcastChannel('ixl-' + SESSION); } catch (e) {}
    var K = 'ixl:' + SESSION + ':';
    function rd(k, d) { try { return JSON.parse(localStorage.getItem(K + k)) || d; } catch (e) { return d; } }
    function wr(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) {} ping(k); }
    var subs = { v: {}, c: {}, p: [] };
    function ping(k) { if (CH) CH.postMessage(k); fire(k); }
    function fire(k) {
      var p = k.split('/');
      if (p[0] === 'v' && subs.v[p[1]]) subs.v[p[1]](rd(k, {}));
      if (p[0] === 'c' && subs.c[p[1]]) subs.c[p[1]](rd(k, {}));
      if (p[0] === 'p') subs.p.forEach(function (cb) { cb(Object.keys(rd('p', {})).length); });
    }
    if (CH) CH.onmessage = function (e) { fire(e.data); };
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf(K) === 0) fire(e.key.slice(K.length));
    });
    var seat = rd('p', {}); seat[DEV] = 1; wr('p', seat);
    window.addEventListener('pagehide', function () {
      var s = rd('p', {}); delete s[DEV]; wr('p', s);
    });
    return {
      ready: Promise.resolve(),
      vote: function (q, c) { var o = rd('v/' + q, {}); o[DEV] = c; wr('v/' + q, o); },
      onVotes: function (q, cb) { subs.v[q] = cb; cb(rd('v/' + q, {})); },
      onCtrl: function (q, cb) { subs.c[q] = cb; cb(rd('c/' + q, {})); },
      setCtrl: function (q, o) { wr('c/' + q, o); },
      onPresence: function (cb) { subs.p.push(cb); cb(Object.keys(rd('p', {})).length); },
      wipe: function () {
        Object.keys(localStorage).filter(function (k) { return k.indexOf(K) === 0; })
          .forEach(function (k) { localStorage.removeItem(k); });
        location.reload();
      }
    };
  }

  function FirebaseT() {
    var api = {}, pending = { v: {}, c: {}, p: [] };
    var ready = Promise.all([
      import('https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js')
    ]).then(function (m) {
      var app = m[0].initializeApp(CFG.firebase), D = m[1];
      var db = D.getDatabase(app), root = 's/' + SESSION;
      api.set = function (p, v) { return D.set(D.ref(db, root + '/' + p), v); };
      api.on  = function (p, cb) { return D.onValue(D.ref(db, root + '/' + p), function (s) { cb(s.val() || {}); }); };
      api.rm  = function (p) { return D.remove(D.ref(db, root + '/' + p)); };
      /* presence: drop this device from the roster the moment it disconnects */
      var me = D.ref(db, root + '/p/' + DEV);
      D.onDisconnect(me).remove();
      /* ── PROVE THE DATABASE IS REACHABLE ────────────────────────────────
         Loading the SDK is not the same as connecting. With a placeholder
         config, or rules that deny, or an expired test-mode ruleset, the
         import succeeds and initializeApp never complains — the failure only
         shows up on the first write, asynchronously. If that write is not
         awaited here, `ready` resolves, .catch never runs, the watchdog sees
         a settled promise, and students sit in the held state forever with no
         reveal and no explanation. So: await the write, AND race it against
         .info/connected, so a hang degrades as surely as a rejection.       */
      return Promise.race([
        D.set(me, true),
        new Promise(function (_, rej) {
          var un = D.onValue(D.ref(db, '.info/connected'), function (s) {
            if (s.val() === true) { un(); }
          });
          setTimeout(function () { un && un(); rej(new Error('database unreachable')); }, 8000);
        })
      ]).then(function () {
        Object.keys(pending.v).forEach(function (q) { api.on('v/' + q, pending.v[q]); });
        Object.keys(pending.c).forEach(function (q) { api.on('c/' + q, pending.c[q]); });
        if (pending.p.length) api.on('p', function (o) {
          pending.p.forEach(function (cb) { cb(Object.keys(o).length); });
        });
      });
    }).catch(function (err) {
      console.error('[ix-live] Firebase did not connect — check CFG.firebase and the database rules.', err);
      degrade('Live polling could not connect.');
    });
    /* Every method is a no-op until the SDK is live, and can never throw.
       Without this, a failed connect turned each submit into an uncaught
       TypeError in the student's browser. */
    return {
      ready: ready,
      vote:    function (q, c) { ready.then(function () { if (api.set) api.set('v/' + q + '/' + DEV, c); }); },
      onVotes: function (q, cb) { pending.v[q] = cb; if (api.on) api.on('v/' + q, cb); },
      onCtrl:  function (q, cb) { pending.c[q] = cb; if (api.on) api.on('c/' + q, cb); },
      setCtrl: function (q, o) { ready.then(function () { if (api.set) api.set('c/' + q, o); }); },
      onPresence: function (cb) {
        pending.p.push(cb);
        if (api.on) api.on('p', function (o) { cb(Object.keys(o).length); });
      },
      wipe: function () { ready.then(function () { if (api.rm) { api.rm('v'); api.rm('c'); location.reload(); } }); }
    };
  }

  /* ── FAIL OPEN ──────────────────────────────────────────────────────────
     A student who has answered but can never reach the explanation is a worse
     outcome than an early reveal — and if the transport is down the presenter
     cannot release the question anyway. Degrading removes body.ixl-live, which
     every hold rule is scoped to, so the file instantly reverts to its normal
     reveal-on-submit behavior and anything already answered opens at once. */
  var degraded = false;
  function degrade(why) {
    if (degraded) return;
    degraded = true;
    document.body.classList.remove('ixl-live');
    document.querySelectorAll('.ixl-strip, .ixl-bars').forEach(function (el) { el.remove(); });
    document.querySelectorAll('.ix-poll .ix-sub-btn').forEach(function (b) {
      var poll = b.closest('.ix-poll');
      if (poll && !poll.classList.contains('ix-done')) {
        b.disabled = false;
        if (/Answer released|Answers closed/.test(b.textContent)) b.textContent = 'Submit Answer';
      }
    });
    var n = document.createElement('div');
    n.id = 'ixl-degraded';
    n.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99999;background:#C8392B;color:#fff;' +
      'padding:11px 15px;border-radius:9px;font:600 12px/1.5 system-ui,sans-serif;max-width:330px;' +
      'box-shadow:0 8px 24px rgba(0,0,0,.3)';
    n.innerHTML = (why || 'Live polling unavailable.') +
      '<br><span style="font-weight:400;opacity:.85">Answers stay on this device and explanations ' +
      'unlock normally.</span>';
    document.body.appendChild(n);
    setTimeout(function () { n.style.transition = 'opacity .6s'; n.style.opacity = '0'; }, 11000);
    setTimeout(function () { if (n.parentNode) n.remove(); }, 12000);
  }

  var T = (CFG.mode === 'rehearsal') ? RehearsalT() : FirebaseT();

  /* watchdog: covers a hanging connection, not just an outright failure */
  if (CFG.mode !== 'rehearsal') {
    var settled = false;
    T.ready.then(function () { settled = true; }, function () { settled = true; });
    setTimeout(function () {
      if (!settled) degrade('Live polling is not responding.');
    }, 11000);
  }

  /* ══ PER-QUESTION WIRING ═════════════════════════════════════════════════ */

  function tally(votes) {
    var c = [0, 0, 0, 0, 0], n = 0;
    Object.keys(votes).forEach(function (d) { var i = +votes[d]; if (i >= 0) { c[i] = (c[i] || 0) + 1; n++; } });
    return { c: c, n: n };
  }

  function bars(poll) {
    var w = poll.querySelector('.ixl-bars');
    if (w) return w;
    w = document.createElement('div'); w.className = 'ixl-bars';
    var n = poll.querySelectorAll('.ix-opt').length;
    var key = parseInt(poll.getAttribute('data-answer'), 10);
    var h = '';
    for (var i = 0; i < n; i++) {
      h += '<div class="ixl-row' + (i === key ? ' ixl-key' : '') + '" data-i="' + i + '">' +
           '<span class="ixl-let">' + LET[i] + '</span>' +
           '<span class="ixl-track"><i class="ixl-fill"></i></span>' +
           '<span class="ixl-pct">&mdash;</span></div>';
    }
    w.innerHTML = h;
    (poll.querySelector('.ix-fb') || poll).insertAdjacentElement('afterend', w);
    return w;
  }

  function paint(id) {
    if (degraded) return;
    var poll = byId[id]; if (!poll) return;
    var t = tally(counts[id] || {}), c = ctrl[id] || {};
    var open = !!c.revealed;

    poll.classList.toggle('ixl-open', open);
    poll.classList.toggle('ixl-closed', !!c.closed && !open);

    /* a closed OR released question stops taking new answers */
    var btn = poll.querySelector('.ix-sub-btn');
    if (btn && !poll.classList.contains('ix-done')) {
      btn.disabled = !!(c.closed || open);
      if (btn.disabled && btn.textContent === 'Submit Answer') btn.textContent = open ? 'Answer released' : 'Answers closed';
      if (!btn.disabled && /Answer released|Answers closed/.test(btn.textContent)) btn.textContent = 'Submit Answer';
    }

    /* students see the distribution only after release; presenter always */
    if (open || PRESENT) {
      var w = bars(poll);
      Array.prototype.forEach.call(w.querySelectorAll('.ixl-row'), function (row) {
        var i = +row.getAttribute('data-i'), v = t.c[i] || 0;
        var pct = t.n ? Math.round(v / t.n * 100) : 0;
        row.querySelector('.ixl-fill').style.width = pct + '%';
        row.querySelector('.ixl-pct').textContent = t.n ? pct + '% (' + v + ')' : '\u2014';
        row.classList.toggle('ixl-mine', myPick[id] === i);
      });
    } else {
      var old = poll.querySelector('.ixl-bars'); if (old) old.remove();
    }

    /* status strip */
    var s = poll.querySelector('.ixl-strip');
    if (!s) {
      s = document.createElement('div'); s.className = 'ixl-strip';
      (poll.querySelector('.ix-sub-btn') || poll).insertAdjacentElement('afterend', s);
    }
    var left = c.deadline ? Math.max(0, Math.ceil((c.deadline - Date.now()) / 1000)) : null;
    s.innerHTML =
      (open ? '' : '<span class="ixl-dot"></span>') +
      '<span>' + (open ? 'Answer released' : (c.closed ? 'Answers closed' : 'Collecting answers')) + '</span>' +
      '<span>' + t.n + (PRESENT ? ' / ' + CFG.classSize : '') + ' answered</span>' +
      (left !== null && !open
        ? '<span class="ixl-clock' + (left <= 10 ? ' ixl-warn' : '') + '">' +
          Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2) + '</span>' : '') +
      /* presenter gets controls on the question itself, so nothing depends on
         scroll detection guessing which question you mean */
      (PRESENT
        ? '<button class="ixl-mini" data-q="' + id + '" data-a="' + (open ? 'reset' : 'reveal') + '">' +
            (open ? 'Re-hold' : 'Reveal') + '</button>' +
          (CFG.timerSeconds && !open
            ? '<button class="ixl-mini' + (c.deadline ? ' ixl-on' : '') + '" data-q="' + id + '" data-a="timer">' +
              (c.deadline ? 'Stop' : CFG.timerSeconds + 's') + '</button>' : '')
        : '');

    if (PRESENT && id === curId) drawPanel();
  }

  function arm(poll, i) {
    var id = poll.id; if (!id) return;
    byId[id] = poll; polls.push(poll);
    T.onVotes(id, function (v) { counts[id] = v; paint(id); });
    T.onCtrl(id, function (c) { ctrl[id] = c || {}; paint(id); });
  }

  document.querySelectorAll('.ix-poll').forEach(function (p, i) {
    if (!p.id) p.id = 'ixq' + i;   /* the engine needs a stable key */
    arm(p, i);
  });

  /* capture the submission and forward the vote (runs after the grader) */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.ix-sub-btn') : null;
    if (!b) return;
    var poll = b.closest('.ix-poll'); if (!poll) return;
    setTimeout(function () {
      if (!poll.classList.contains('ix-done')) return;          /* nothing was picked */
      var opts = Array.prototype.slice.call(poll.querySelectorAll('.ix-opt'));
      var pick = -1;
      opts.forEach(function (o, i) { if (o.querySelector('input').checked) pick = i; });
      if (pick < 0) return;
      opts.forEach(function (o, i) { o.classList.toggle('ixl-mine', i === pick); });
      myPick[poll.id] = pick;
      if (!PRESENT) T.vote(poll.id, pick);                      /* presenter demo clicks don't count */
      paint(poll.id);
    }, 0);
  });

  /* one shared clock drives every countdown */
  setInterval(function () {
    var live = false;
    Object.keys(ctrl).forEach(function (id) {
      var c = ctrl[id]; if (!c || !c.deadline || c.revealed) return;
      live = true;
      if (Date.now() >= c.deadline) {
        var patch = { deadline: null, revealed: !!CFG.revealOnTimeUp, closed: !!CFG.closeOnTimeUp };
        if (PRESENT) T.setCtrl(id, patch);        /* only the presenter writes, to avoid 40 racing writes */
        else { ctrl[id] = patch; }
      }
      paint(id);
    });
    if (!live && PRESENT) drawPanel();
  }, 1000);

  /* ══ PRESENTER PANEL ═════════════════════════════════════════════════════ */
  if (!PRESENT) return;

  panel = document.createElement('div');
  panel.id = 'ixl-panel';
  document.body.appendChild(panel);

  T.onPresence(function (n) { connected = n; drawPanel(); });

  function nearest() {
    var mid = window.innerHeight / 2, best = null, bd = Infinity;
    polls.forEach(function (p) {
      var r = p.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) return;
      var d = Math.abs((r.top + r.bottom) / 2 - mid);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }

  function drawPanel() {
    if (!panel) return;
    var poll = byId[curId] || nearest();
    if (!poll) { panel.innerHTML = '<div class="ixl-hd">ix-live &middot; scroll to a question</div>'; return; }
    curId = poll.id;
    var t = tally(counts[curId] || {}), c = ctrl[curId] || {};
    var pct = CFG.classSize ? Math.min(100, Math.round(t.n / CFG.classSize * 100)) : 0;
    var label = (poll.querySelector('.ix-n') || {}).textContent || curId;
    var left = c.deadline ? Math.max(0, Math.ceil((c.deadline - Date.now()) / 1000)) : null;

    panel.innerHTML =
      '<div class="ixl-hd"><span>ix-live &middot; ' + SESSION + '</span>' +
        '<button data-a="min" title="Collapse">&minus;</button></div>' +
      '<div class="ixl-hide">' +
        '<div class="ixl-qn">' + label.replace(/</g, '&lt;').slice(0, 74) + '</div>' +
        '<div class="ixl-big">' + t.n + ' <span style="font-size:13px;opacity:.55">/ ' + CFG.classSize + '</span>' +
          (left !== null ? ' <span style="font-size:14px;opacity:.8">&middot; ' +
            Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2) + '</span>' : '') + '</div>' +
        '<div class="ixl-sub">' + (c.revealed ? 'released' : (c.closed ? 'closed' : 'collecting')) +
          ' &middot; ' + connected + ' device' + (connected === 1 ? '' : 's') + ' connected</div>' +
        '<div class="ixl-meter"><i style="width:' + pct + '%"></i></div>' +
        '<div class="ixl-btns">' +
          (CFG.timerSeconds ? '<button class="ixl-a ixl-b" data-a="timer">' +
            (left !== null ? 'Stop' : '\u23F1 ' + CFG.timerSeconds + 's') + '</button>' : '') +
          '<button class="ixl-a" data-a="reveal"' + (c.revealed ? ' disabled' : '') + '>\u{1F441} Reveal</button>' +
          '<button class="ixl-a ixl-b" data-a="reset">\u21BA</button>' +
        '</div>' +
        '<div class="ixl-foot">Class size <input class="ixl-n" data-a="size" value="' + CFG.classSize + '"> ' +
          '&middot; keys: <b>R</b> reveal, <b>T</b> timer, <b>N</b> next' +
          '<br><a href="#" data-a="wipe" style="color:#ff9b90">reset the whole session</a></div>' +
      '</div>';
  }

  function act(a, forId) {
    var id = forId || curId; if (!id) return;
    if (forId) curId = forId;
    var c = ctrl[id] || {};
    if (a === 'reveal') T.setCtrl(id, { revealed: true, closed: true, deadline: null });
    if (a === 'reset')  T.setCtrl(id, { revealed: false, closed: false, deadline: null });
    if (a === 'timer')  T.setCtrl(id, c.deadline
      ? { revealed: false, closed: false, deadline: null }
      : { revealed: false, closed: false, deadline: Date.now() + CFG.timerSeconds * 1000 });
    if (a === 'next') {
      var i = polls.findIndex(function (p) { return p.id === id; });
      if (polls[i + 1]) { curId = polls[i + 1].id; polls[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    if (a === 'wipe' && confirm('Clear every answer and reveal state for session "' + SESSION + '"?')) T.wipe();
    drawPanel();
  }

  document.addEventListener('click', function (e) {
    var m = e.target.closest ? e.target.closest('.ixl-mini') : null;
    if (!m) return;
    e.preventDefault(); e.stopPropagation();
    act(m.getAttribute('data-a'), m.getAttribute('data-q'));
  });

  panel.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a');
    if (a === 'min') { panel.classList.toggle('ixl-min'); return; }
    if (a === 'size') return;
    e.preventDefault(); act(a);
  });
  panel.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-a') !== 'size') return;
    var n = parseInt(e.target.value, 10);
    if (n > 0) { CFG.classSize = n; try { localStorage.setItem('ixl-size', n); } catch (err) {} }
    drawPanel();
  });
  try { var sz = parseInt(localStorage.getItem('ixl-size'), 10); if (sz > 0) CFG.classSize = sz; } catch (e) {}

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
    var k = e.key.toLowerCase();
    if (k === 'r') { e.preventDefault(); act('reveal'); }
    if (k === 't') { e.preventDefault(); act('timer'); }
    if (k === 'n') { e.preventDefault(); act('next'); }
  });

  var tick;
  window.addEventListener('scroll', function () {
    clearTimeout(tick);
    tick = setTimeout(function () { var p = nearest(); if (p) { curId = p.id; drawPanel(); } }, 120);
  }, { passive: true });

  /* optional automatic release once enough of the room has answered */
  if (CFG.gate === 'threshold') {
    setInterval(function () {
      Object.keys(counts).forEach(function (id) {
        var c = ctrl[id] || {};
        if (c.revealed || !CFG.classSize) return;
        if (tally(counts[id]).n / CFG.classSize >= CFG.responseTarget) {
          T.setCtrl(id, { revealed: true, closed: true, deadline: null });
        }
      });
    }, 1200);
  }

  drawPanel();
})();
</script>
